# ──────────────────────────────────────────────────────────────────────────────
# Dependency Review — NIST 800-171: SI-2, SR-4, SR-5
#
# Scans PRs for newly introduced vulnerable or license-problematic dependencies.
# Blocks merge if critical/high vulnerabilities are found.
# ──────────────────────────────────────────────────────────────────────────────
name: "Dependency Review"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Block on critical and high severity vulnerabilities
          fail-on-severity: high
          # Deny copyleft licenses incompatible with DoD use
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
          # Comment vulnerability report on PR
          comment-summary-in-pr: always
